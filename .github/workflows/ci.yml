name: CI

on:
  push:
    branches: [main, gpui-preview]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Install GPUI Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libfontconfig1-dev libfreetype-dev libxkbcommon-dev \
            libwayland-dev libx11-xcb-dev libxcb-randr0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libxcb-xkb-dev \
            libxkbcommon-x11-dev libvulkan-dev libasound2-dev
      - name: Format Rust sources
        run: cargo fmt --all -- --check
      - name: Run tests
        run: cargo test --locked
      - name: Check application
        run: cargo check --locked
