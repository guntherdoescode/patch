name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Install GTK dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libgtk-4-dev libadwaita-1-dev
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run tests
        run: cargo test
      - name: Check application
        run: cargo check
