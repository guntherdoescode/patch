[package]
name = "patch"
version = "0.1.0"
edition = "2024"
description = "A native Rust coding agent with explicit execution permissions"
license = "MIT"

[dependencies]
gpui_kit = { package = "gpui_ce_kit", version = "0.3" }
async-channel = "2"
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[build-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
